name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # JOB 1 : Tests & Linting
  # ==========================================
  test:
    name: Run Pytests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start Loki container
        run: |
          docker run -d \
            --name loki \
            -p 3100:3100 \
            -v ${{ github.workspace }}/.github/loki-config.yaml:/etc/loki/local-config.yaml \
            grafana/loki:3.0.0 \
            -config.file=/etc/loki/local-config.yaml

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-suffix: "uv-cache"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff (Linter)
        run: uv run ruff check .

      - name: Run Pytest (FastAPI Integration Tests)
        run: uv run pytest --maxfail=1 --disable-warnings

  # ==========================================
  # JOB 2 : Auto Bump, Tag & Push
  # ==========================================
  release:
    name: Auto Bump & Tag
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3

      - name: Create Bump and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uvx --from commitizen cz bump --yes --allow-no-commit
          git push origin main --tags

  # ==========================================
  # JOB 3 : Déploiement sur PyPI (si Tag)
  # ==========================================
  deploy:
    name: Build & Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi
      url: https://pypi.org/p/loki-middleware

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1