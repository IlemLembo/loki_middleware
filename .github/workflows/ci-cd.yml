# .github/workflows/ci-cd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ "main" , "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" , "master" ]

jobs:
  # ==========================================
  # JOB 1 : Tests d'intégration & Linting
  # ==========================================
  test:
    name: Run Pytests & Linting
    runs-on: ubuntu-latest

    services:
      loki:
        image: grafana/loki:latest
        ports:
          - 3100:3100
        options: >-
          -cmd.config.file=""
          -target=all
          -auth.enabled=false
          -server.http-listen-port=3100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-suffix: "uv-cache"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff (Linter)
        run: uv run ruff check .

      - name: Run Pytest (FastAPI Integration Tests)
        run: uv run pytest --maxfail=1 --disable-warnings

  release:
    name: Auto Bump & Tag
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3

      - name: Create Bump and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv run commitizen bump --yes
          git push origin main --tags

