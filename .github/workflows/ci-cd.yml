name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1 : Tests & Linting
  # ==========================================
  test:
    name: Run Pytests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start Loki container
        run: |
          docker run -d \
            --name loki \
            -p 3100:3100 \
            -v ${{ github.workspace }}/.github/loki-config.yaml:/etc/loki/local-config.yaml \
            grafana/loki:3.0.0 \
            -config.file=/etc/loki/local-config.yaml

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-suffix: "uv-cache"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff (Linter)
        run: uv run ruff check .

      - name: Run Format check
        run: uv run ruff format --check .

      - name: Run Pytest (FastAPI & Django Tests)
        run: uv run pytest --maxfail=1 --disable-warnings

  # ==========================================
  # JOB 2 : Auto Bump & Create Tag (Uniquement sur Push 'main')
  # ==========================================
  release:
    name: Auto Bump & Tag
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'bump:')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with full history & tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v3

      - name: Create Bump and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ajout du flag --files-only ou bypass du changelog si aucun tag n'est trouvé
          uvx --from commitizen cz bump --yes --allow-no-commit
          
          # Pousse les commits de bump ET les tags créés
          git push origin main --follow-tags

  # ==========================================
  # JOB 3 : Build & Publish (Uniquement lors du Push d'un TAG v*)
  # ==========================================
  deploy:
    name: Build & Publish to PyPI
    needs: [test, release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi
      url: https://pypi.org/p/loki-middleware

    steps:
      - name: Checkout tag version
        uses: actions/checkout@v5

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1